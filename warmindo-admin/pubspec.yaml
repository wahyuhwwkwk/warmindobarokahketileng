name: warmindo_admin
description: "Admin & Kasir app untuk Warmindo Barokah - Real-time Order Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  socket_io_client: ^2.0.3+1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  pdf: ^3.11.3
  printing: ^5.14.2
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^19.0.0
  flutter_background_service: ^5.0.12
  flutter_background_service_android: ^6.2.7
  permission_handler: ^11.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.jpg"
  adaptive_icon_background: "#FF8C00"
  adaptive_icon_foreground: "assets/app_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.jpg
